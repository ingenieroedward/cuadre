<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cuadre</title>
<style>
:root{--bg:#f6f5fb;--card:#fff;--tx:#1d1b26;--mut:#6b6880;--pri:#820ad1;--ok:#14803c;--bad:#c0262d;--bd:#e4e1ee}
@media(prefers-color-scheme:dark){:root{--bg:#14121b;--card:#1e1b29;--tx:#eeecf5;--mut:#9a96b0;--pri:#b66cf0;--ok:#4cc77f;--bad:#ff7a80;--bd:#322e44}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,sans-serif}
nav{display:flex;gap:16px;align-items:center;flex-wrap:wrap;padding:12px 16px;background:var(--card);border-bottom:1px solid var(--bd)}
nav a{color:var(--tx);text-decoration:none;font-weight:500}nav a:hover{color:var(--pri)}nav .sp{flex:1}
main{max-width:1000px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px;margin-bottom:16px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.big{font-size:26px;font-weight:700}.mut{color:var(--mut)}.ok{color:var(--ok)}.bad{color:var(--bad)}
table{width:100%;border-collapse:collapse}th,td{padding:8px 6px;text-align:left;border-bottom:1px solid var(--bd);vertical-align:middle}
th{color:var(--mut);font-weight:500;font-size:13px}td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
input,select,button{font:inherit;padding:8px 10px;border-radius:8px;border:1px solid var(--bd);background:var(--card);color:var(--tx)}
button{background:var(--pri);color:#fff;border:0;cursor:pointer}button.g{background:transparent;color:var(--mut);border:1px solid var(--bd);padding:4px 8px}
form.row{display:flex;gap:8px;flex-wrap:wrap;align-items:end}label{display:flex;flex-direction:column;gap:2px;font-size:13px;color:var(--mut)}
.wrap{overflow-x:auto}h1,h2{margin:0 0 12px}
</style></head><body>
{% if u %}<nav><strong>💜 Cuadre</strong><a href="/">Resumen</a><a href="/movimientos">Movimientos</a>
<a href="/subir">Subir extractos</a><a href="/miembros">Miembros</a><span class="sp"></span><span class="mut">{{u.nombre}}</span><a href="/logout">Salir</a></nav>{% endif %}
<main>{% block c %}{% endblock %}</main></body></html>
