{% extends "base.html" %}{% block c %}
<div class="card"><h2>Agregar ingreso o gasto manual</h2>
<form class="row" method="post" action="/movimientos/nuevo">
<label>Fecha<input type="date" name="fecha" value="{{hoy}}" required></label>
<label>Tipo<select name="tipo"><option value="gasto">Gasto</option><option value="ingreso">Ingreso</option></select></label>
<label>Descripción<input name="descripcion" required></label>
<label>Valor<input name="monto" type="number" step="any" min="0" required></label>
<label>Categoría<select name="categoria">{% for c in cats %}<option>{{c}}</option>{% endfor %}</select></label>
<label>Persona<select name="persona">{% for x in users %}<option value="{{x.id}}" {{'selected' if x.id==u.id}}>{{x.nombre}}</option>{% endfor %}</select></label>
<button>Agregar</button></form></div>
<div class="card"><form class="row" method="get">
<label>Mes<input type="month" name="mes" value="{{f.mes}}"></label>
<label>Persona<select name="persona"><option value="0">Todas</option>{% for x in users %}<option value="{{x.id}}" {{'selected' if x.id==f.persona}}>{{x.nombre}}</option>{% endfor %}</select></label>
<label>Categoría<select name="cat"><option value="">Todas</option>{% for c in cats %}<option {{'selected' if c==f.cat}}>{{c}}</option>{% endfor %}</select></label>
<label>Buscar<input name="q" value="{{f.q}}"></label><button>Filtrar</button>
<a href="/export.csv?mes={{f.mes}}&persona={{f.persona}}&cat={{f.cat}}&q={{f.q}}" style="align-self:center">⬇ CSV</a></form></div>
<div class="card wrap"><table><tr><th>Fecha</th><th>Persona</th><th>Banco</th><th>Descripción</th><th>Categoría</th><th class="n">Valor</th><th></th></tr>
{% for r in rows %}<tr><td>{{r.fecha}}</td><td>{{r.nombre}}</td><td class="mut">{{r.banco}}</td><td>{{r.descripcion}}</td>
<td><form method="post" action="/movimientos/{{r.id}}/categoria" style="display:flex;gap:4px;align-items:center">
<select name="categoria" onchange="this.form.submit()">{% for c in cats %}<option {{'selected' if c==r.categoria}}>{{c}}</option>{% endfor %}</select>
<label style="flex-direction:row;align-items:center" title="Aplicar a movimientos parecidos"><input type="checkbox" name="aplicar_similares" value="1"> todos</label></form></td>
<td class="n {{ 'ok' if r.monto>0 else 'bad' }}">{{ "{:,.0f}".format(r.monto).replace(",", ".") }}</td>
<td><form method="post" action="/movimientos/{{r.id}}/borrar" onsubmit="return confirm('¿Borrar?')"><button class="g">✕</button></form></td></tr>
{% else %}<tr><td colspan="7" class="mut">Sin movimientos.</td></tr>{% endfor %}</table></div>{% endblock %}
