services:
  cuadre:
    build: .
    restart: unless-stopped
    environment:
      HTTPS_ONLY: "1"
      TZ: America/Bogota
      OWN_NAMES: ${OWN_NAMES:-}
      VAPID_CONTACT: ${VAPID_CONTACT:-mailto:admin@example.com}
    volumes:
      - cuadre_data:/data
    expose:
      - "8000"
volumes:
  cuadre_data:
